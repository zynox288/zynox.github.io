<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIT-SS | Authorized Access</title>
    <style>
        :root {
            --fox-orange: #ff8c00;
            --dark-bg: #0b0b14;
            --card-bg: rgba(255, 255, 255, 0.05);
            --text-main: #e0e0e0;
        }

        body {
            margin: 0;
            background-color: var(--dark-bg);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Fox Glow Background */
        .aura {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vw;
            background: radial-gradient(circle, rgba(255, 140, 0, 0.04) 0%, rgba(11, 11, 20, 0) 70%);
            transform: translate(-50%, -50%);
            z-index: -1;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 10%;
            background: rgba(11, 11, 20, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo { font-size: 1.5rem; font-weight: bold; color: var(--fox-orange); letter-spacing: 2px; }

        header { text-align: center; padding: 100px 10%; flex-grow: 1; }

        h1 { font-size: 3rem; margin: 10px 0; }
        .subtitle { font-size: 1.1rem; opacity: 0.6; margin-bottom: 40px; }

        /* Login & Download Buttons */
        .btn {
            padding: 18px 45px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
            transition: 0.3s;
            cursor: pointer;
            border: none;
            font-size: 1.1rem;
        }

        .btn-discord { background: #5865F2; color: white; }
        .btn-download { background: var(--fox-orange); color: white; box-shadow: 0 4px 15px rgba(255, 140, 0, 0.3); }

        .btn:hover { transform: translateY(-3px); filter: brightness(1.1); }

        .user-info { margin-top: 20px; font-size: 0.9rem; color: #5865F2; font-weight: bold; }

        .hidden { display: none; }

        footer { text-align: center; padding: 40px; opacity: 0.3; font-size: 0.8rem; }
    </style>
</head>
<body>

    <div class="aura"></div>

    <nav>
        <div class="logo">BIT-SS</div>
    </nav>

    <header id="auth-gate">
        <h1>Access <span style="color:var(--fox-orange)">Locked.</span></h1>
        <p class="subtitle">Authorization required to download the Bit-SS security tool.</p>
        <button onclick="loginWithDiscord()" class="btn btn-discord">LOGIN WITH DISCORD</button>
    </header>

    <header id="download-zone" class="hidden">
        <h1>Welcome, <span id="user-display" style="color:var(--fox-orange)">Hunter</span></h1>
        <p class="subtitle">You are authorized. Download the latest version below.</p>
        <a href="https://github.com/zynox288/zynox.github.io/releases/" class="btn btn-download">
            DOWNLOAD BIT-SS (.EXE)
        </a>
        <div class="user-info">Logged in as <span id="user-tag"></span></div>
    </header>

    <footer>
        &copy; 2026 zynox288 Security | bit-ss scanner project
    </footer>

    <script>
        // --- CONFIGURATION ---
        const CLIENT_ID = '1467496595502403614'; // Get this from Discord Developer Portal
        const REDIRECT_URI = window.location.origin + window.location.pathname;

        function loginWithDiscord() {
            const url = `https://discord.com/api/oauth2/authorize?client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&response_type=token&scope=identify`;
            window.location.href = url;
        }

        async function checkAuth() {
            const fragment = new URLSearchParams(window.location.hash.slice(1));
            const token = fragment.get('access_token');

            if (token) {
                try {
                    const response = await fetch('https://discord.com/api/users/@me', {
                        headers: { authorization: `Bearer ${token}` }
                    });
                    const user = await response.json();

                    if (user.username) {
                        // Switch UI
                        document.getElementById('auth-gate').classList.add('hidden');
                        document.getElementById('download-zone').classList.remove('hidden');
                        
                        // Show User Info
                        document.getElementById('user-display').innerText = user.username;
                        document.getElementById('user-tag').innerText = `${user.username}#${user.discriminator || '0'}`;
                        
                        // Clean the URL (remove the token for safety)
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }
                } catch (err) {
                    console.error("Auth failed", err);
                }
            }
        }

        // Run on page load
        checkAuth();
    </script>
</body>
</html>
