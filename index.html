<!DOCTYPE html>
<html lang="en">
<head>
    <title>BIT-SS Dashboard</title>
    <style>
        body { background: #0f0f1a; color: white; font-family: sans-serif; text-align: center; padding: 50px; }
        .card { background: rgba(255,255,255,0.05); padding: 30px; border-radius: 15px; border: 1px solid #ff8c00; display: inline-block; min-width: 400px; }
        .btn-discord { background: #5865F2; color: white; padding: 12px 25px; border-radius: 5px; text-decoration: none; font-weight: bold; }
        .pin-display { font-size: 3rem; color: #ff8c00; margin: 20px 0; letter-spacing: 10px; font-family: monospace; }
        .log { background: black; text-align: left; padding: 10px; height: 150px; overflow-y: scroll; margin-top: 20px; font-size: 0.8rem; color: #00ff7f; border: 1px solid #333; }
    </style>
</head>
<body>

    <div class="card" id="login-view">
        <h2>STAFF AUTHORIZATION</h2>
        <p>Login with Discord to access the SS Control Panel</p>
        <br>
        <a href="#" class="btn-discord" onclick="showDash()">LOGIN WITH DISCORD</a>
    </div>

    <div class="card" id="dash-view" style="display:none;">
        <h2>COMMAND CENTER</h2>
        <p>Generate a PIN for the user's tool:</p>
        <div class="pin-display" id="pin">------</div>
        <button onclick="genPin()" style="padding:10px 20px; cursor:pointer;">GENERATE NEW PIN</button>
        
        <div class="log" id="log">
            [SYSTEM] Waiting for scan...
        </div>
    </div>

    <script>
        function showDash() {
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('dash-view').style.display = 'block';
        }

        function genPin() {
            const newPin = Math.floor(100000 + Math.random() * 900000);
            document.getElementById('pin').innerText = newPin;
            const log = document.getElementById('log');
            log.innerHTML += `<div>[${new Date().toLocaleTimeString()}] Generated PIN: ${newPin}</div>`;
        }
    </script>
</body>
</html>
